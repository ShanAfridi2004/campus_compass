<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Campus Compass</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #243247;
        }

        header {
            background: #12345a;
            color: white;
            padding: 22px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 10px;
        }

        .hero {
            background: linear-gradient(120deg, #12345a, #2675a8);
            color: white;
            text-align: center;
            padding: 55px 20px;
        }

        .contact {
            max-width: 650px;
            margin: 45px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 12px #0002;
        }

        .contact h2 {
            color: #12345a;
            text-align: center;
        }

        input, textarea {
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            background: #12345a;
            color: white;
            padding: 13px 25px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #2675a8;
        }

        footer {
            background: #12345a;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

<header>
    <h2>Campus Compass</h2>

    <nav>
        <a href="index.html">Home</a>
        <a href="departments.html">Departments</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<section class="hero">
    <h1>Contact Us</h1>
    <p>We Would Love to Hear From You</p>
</section>

<section class="contact">

    <h2>Get In Touch</h2>

    <form onsubmit="alert('Thank you for contacting Campus Compass!'); return false;">

        <input type="text" placeholder="Your Name" required>

        <input type="email" placeholder="Your Email" required>

        <input type="text" placeholder="Subject" required>

        <textarea rows="5" placeholder="Write Your Message" required></textarea>

        <button type="submit">Send Message</button>

    </form>

</section>

<footer>
    <p>© 2026 Campus Compass | All Rights Reserved</p>
</footer>

</body>
</html>
